name: Validate SonicVhibez renderer

on:
  push:
    paths:
      - "scripts/render_sonicvhibez_short.py"
      - ".github/workflows/validate-sonicvhibez-renderer.yml"
  pull_request:
    paths:
      - "scripts/render_sonicvhibez_short.py"
      - ".github/workflows/validate-sonicvhibez-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Compile renderer
        run: python -m py_compile scripts/render_sonicvhibez_short.py
      - name: Check command-line help
        run: python scripts/render_sonicvhibez_short.py --help
      - name: Generate synthetic smoke-test media
        run: |
          mkdir -p /tmp/renderer-test
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=180x320:rate=30:duration=45" -an -c:v libx264 -pix_fmt yuv420p /tmp/renderer-test/test-video.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=8" -c:a pcm_s16le /tmp/renderer-test/test-voice.wav
          cat > /tmp/renderer-test/test-captions.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:03,000
          Automated render smoke test

          SRT
      - name: Render test output (never uploads or publishes)
        run: |
          python scripts/render_sonicvhibez_short.py \
            --video /tmp/renderer-test/test-video.mp4 \
            --voice /tmp/renderer-test/test-voice.wav \
            --captions /tmp/renderer-test/test-captions.srt \
            --output /tmp/renderer-test/output.mp4 \
            --duration 45
      - name: Verify output dimensions, codecs and duration
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of csv=p=0 /tmp/renderer-test/output.mp4 | grep -Fx '1080,1920,h264'
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/renderer-test/output.mp4 | awk '{ if ($1 < 44.5 || $1 > 45.5) exit 1 }'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/renderer-test/output.mp4 | grep -Fx 'aac'
