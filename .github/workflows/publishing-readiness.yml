name: Nature Frontiers publishing (gated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/publish-facebook.mjs"
      - "scripts/test-publishing-safety.mjs"
      - "data/campaigns.json"
      - "data/products.json"
      - "scripts/validate-campaign.mjs"
      - "package.json"
      - ".github/workflows/publishing-readiness.yml"
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

concurrency:
  group: nature-frontiers-publishing
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate product catalogue
        run: node scripts/validate-campaign.mjs
      - name: Test fail-closed publishing controls
        run: node scripts/test-publishing-safety.mjs

  facebook-publisher:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run gated Facebook Page adapter
        env:
          PUBLISH_ENABLED: 'false' # Hard lock: keep live publishing disabled
          PUBLISH_DRY_RUN: 'true' # Hard lock: dry-run only
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook.mjs
