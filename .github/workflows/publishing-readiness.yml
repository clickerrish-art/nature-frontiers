name: Nature Frontiers publishing (gated)

on:
  workflow_dispatch:
    inputs:
      live_publish_authorized:
        description: "Explicitly authorize one live publishing run after all launch checks (leave false for checks/dry runs)."
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/publish-facebook.mjs"
      - "scripts/publish-facebook-reel.mjs"
      - "scripts/facebook-reel-guards.mjs"
      - "scripts/test-facebook-reel-guards.mjs"
      - "scripts/test-publishing-safety.mjs"
      - "data/campaigns.json"
      - "data/products.json"
      - "scripts/validate-campaign.mjs"
      - "package.json"
      - ".github/workflows/publishing-readiness.yml"
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

concurrency:
  group: nature-frontiers-publishing
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate product catalogue
        run: node scripts/validate-campaign.mjs
      - name: Test fail-closed feed publishing controls
        run: node scripts/test-publishing-safety.mjs
      - name: Check Facebook publishing script syntax
        run: node --check scripts/publish-facebook.mjs && node --check scripts/publish-facebook-reel.mjs
      - name: Test Facebook Reel release guards
        run: node --test scripts/test-facebook-reel-guards.mjs

  facebook-publisher:
    # Publishing writes durable campaign state to the dispatch ref. Never permit
    # this job to write to main; use a dedicated non-main release branch.
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    permissions:
      contents: write
    needs: safety-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run gated Facebook Page adapter
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook.mjs
      - name: Run gated Facebook Reels adapter
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook-reel.mjs
