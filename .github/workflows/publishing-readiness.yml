name: Nature Frontiers publishing (gated)

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Select exactly one publishing adapter for this one-shot authorization."
        required: true
        type: choice
        options:
          - reel
          - feed
          - video
        default: reel
      live_publish_authorized:
        description: "Explicitly authorize one live publishing operation after all launch checks (leave false for checks/dry runs)."
        required: true
        type: boolean
        default: false
  push:
    branches:
      - "codex/facebook-reels-publisher"
      - "codex/nature-frontiers-youtube-series"
    paths:
      - "scripts/check-meta-readiness.mjs"
      - "scripts/publish-facebook.mjs"
      - "scripts/facebook-feed-guards.mjs"
      - "scripts/test-facebook-feed-guards.mjs"
      - "scripts/publish-facebook-reel.mjs"
      - "scripts/facebook-reel-guards.mjs"
      - "scripts/facebook-reel-media.mjs"
      - "scripts/test-facebook-reel-media.mjs"
      - "scripts/test-facebook-reel-guards.mjs"
      - "scripts/publish-facebook-video.mjs"
      - "scripts/facebook-video-guards.mjs"
      - "scripts/facebook-video-media.mjs"
      - "scripts/test-facebook-video-guards.mjs"
      - "scripts/test-facebook-video-media.mjs"
      - "README.md"
      - "scripts/test-publishing-safety.mjs"
      - "scripts/publishing-cadence.mjs"
      - "scripts/test-publishing-cadence.mjs"
      - "scripts/youtube-content.mjs"
      - "scripts/build-youtube-description.mjs"
      - "scripts/test-youtube-content.mjs"
      - "content/youtube/**"
      - "data/youtube-content-policy.json"
      - "data/youtube-series-season-1.json"
      - "data/campaigns.json"
      - "data/products.json"
      - "scripts/validate-campaign.mjs"
      - "package.json"
      - ".github/workflows/publishing-readiness.yml"
      - "docs/YOUTUBE_SERIES_AND_DESCRIPTION_STANDARD.md"
  pull_request:
    paths:
      - "scripts/check-meta-readiness.mjs"
      - "scripts/publish-facebook-reel.mjs"
      - "scripts/facebook-reel-guards.mjs"
      - "scripts/facebook-reel-media.mjs"
      - "scripts/test-facebook-reel-media.mjs"
      - "scripts/test-facebook-reel-guards.mjs"
      - "scripts/publish-facebook-video.mjs"
      - "scripts/facebook-video-guards.mjs"
      - "scripts/facebook-video-media.mjs"
      - "scripts/test-facebook-video-guards.mjs"
      - "scripts/test-facebook-video-media.mjs"
      - "README.md"
      - "scripts/test-publishing-safety.mjs"
      - "scripts/publishing-cadence.mjs"
      - "scripts/test-publishing-cadence.mjs"
      - "scripts/youtube-content.mjs"
      - "scripts/build-youtube-description.mjs"
      - "scripts/test-youtube-content.mjs"
      - "content/youtube/**"
      - "data/youtube-content-policy.json"
      - "data/youtube-series-season-1.json"
      - "data/campaigns.json"
      - "data/products.json"
      - "scripts/validate-campaign.mjs"
      - "package.json"
      - ".github/workflows/publishing-readiness.yml"
      - "docs/YOUTUBE_SERIES_AND_DESCRIPTION_STANDARD.md"
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

concurrency:
  group: nature-frontiers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  safety-tests:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate product catalogue
        run: node scripts/validate-campaign.mjs
      - name: Test fail-closed publishing controls
        run: node scripts/test-publishing-safety.mjs
      - name: Test legacy Facebook feed release guards
        run: node --test scripts/test-facebook-feed-guards.mjs
      - name: Verify MediaInfo is available for video media verification
        run: mediainfo --Version
      - name: Check Facebook publishing script syntax
        run: node --check scripts/publish-facebook.mjs && node --check scripts/publish-facebook-video.mjs && node --check scripts/publish-facebook-reel.mjs && node --check scripts/facebook-feed-guards.mjs && node --check scripts/test-facebook-feed-guards.mjs
      - name: Test Facebook Reel release guards and media integrity
        run: node --test scripts/test-facebook-reel-guards.mjs scripts/test-facebook-reel-media.mjs
      - name: Test long-form video guards and media integrity
        run: node --test scripts/test-facebook-video-guards.mjs scripts/test-facebook-video-media.mjs
      - name: Test Johannesburg daily publishing limits
        run: node --test scripts/test-publishing-cadence.mjs
      - name: Test YouTube series, duration, hook, ad-break and description rules
        run: node --test scripts/test-youtube-content.mjs

  meta-readiness:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check Meta Page access without publishing
        env:
          META_PAGE_ID: "1003575786161492"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: "v27.0"
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN }}
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'true' }}
        run: node scripts/check-meta-readiness.mjs

  facebook-publisher:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series'
    permissions:
      contents: write
    needs: [safety-tests, meta-readiness]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run gated long-form Facebook Page video adapter
        if: inputs.publisher == 'video'
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          PUBLISH_RUN_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'true' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
          META_GRAPH_API_VERSION: "v27.0"
          META_PAGE_ID: "1003575786161492"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook-video.mjs
      - name: Run gated 30-second discovery Reel adapter (requires its published parent video)
        if: inputs.publisher == 'reel'
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          PUBLISH_RUN_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'true' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
          META_GRAPH_API_VERSION: "v27.0"
          META_PAGE_ID: "1003575786161492"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook-reel.mjs
      - name: Run gated Facebook feed post adapter
        if: inputs.publisher == 'feed'
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          PUBLISH_RUN_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nature-frontiers-youtube-series' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'true' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
          META_GRAPH_API_VERSION: "v27.0"
          META_PAGE_ID: "1003575786161492"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook.mjs
