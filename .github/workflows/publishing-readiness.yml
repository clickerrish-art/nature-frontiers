name: Nature Frontiers publishing (gated)

on:
  workflow_dispatch:
    inputs:
      live_publish_authorized:
        description: "Explicitly authorize one live publishing run after all launch checks (leave false for checks/dry runs)."
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/publish-facebook.mjs"
      - "scripts/test-publishing-safety.mjs"
      - "data/campaigns.json"
      - "data/products.json"
      - "scripts/validate-campaign.mjs"
      - "package.json"
      - "scripts/check-meta-api-version.mjs"
      - "scripts/meta-error-policy.mjs"
      - "scripts/test-meta-error-policy.mjs"
      - "scripts/prepublish-gate.mjs"
      - "scripts/test-prepublish-gate.mjs"
      - "data/prepublish-policy.json"
      - "scripts/meta-webhook.mjs"
      - "scripts/test-meta-webhook.mjs"
      - "data/meta-circuit-breaker.json"
      - ".github/workflows/meta-api-version-monitor.yml"
      - "docs/META_PROACTIVE_OPERATIONS.md"
      - ".github/workflows/publishing-readiness.yml"
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

concurrency:
  group: nature-frontiers-publishing
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check Meta maintenance script syntax
        run: |
          node --check scripts/check-meta-api-version.mjs
          node --check scripts/meta-error-policy.mjs
          node --check scripts/publish-facebook.mjs
          node --check scripts/prepublish-gate.mjs
          node --check scripts/meta-webhook.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('data/meta-api-audit.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('data/meta-circuit-breaker.json', 'utf8'))"
      - name: Test Meta circuit-breaker policy
        run: node scripts/test-meta-error-policy.mjs
      - name: Validate product catalogue
        run: node scripts/validate-campaign.mjs
      - name: Test Meta webhook verification
        run: node scripts/test-meta-webhook.mjs
      - name: Test pre-publish content and rights gate
        run: node scripts/test-prepublish-gate.mjs
      - name: Test fail-closed publishing controls
        run: node scripts/test-publishing-safety.mjs

  facebook-publisher:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: safety-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run gated Facebook Page adapter
        env:
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.live_publish_authorized == true && vars.PUBLISH_ENABLED == 'true' && 'true' || 'false' }} # Requires both repository opt-in and explicit per-run authorization; scheduled runs are always disabled
          PUBLISH_EMERGENCY_STOP: ${{ vars.PUBLISH_EMERGENCY_STOP || 'true' }} # Emergency stop is active by default; only an explicit false releases this independent gate
          FACEBOOK_PUBLISH_ENABLED: ${{ vars.FACEBOOK_PUBLISH_ENABLED || 'NO' }} # Facebook publishing is off unless explicitly set to YES
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }} # Safe default: dry-run unless deliberately configured
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/publish-facebook.mjs
