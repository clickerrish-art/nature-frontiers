name: Meta token health monitor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/meta-token-health.yml"
      - "scripts/check-meta-token-health.mjs"
      - "scripts/test-meta-token-health.mjs"
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

# Keep the default token read-only. Only the scheduled/owner-dispatched health
# job needs to open a private repository issue when a credential needs action.
permissions:
  contents: read

concurrency:
  group: meta-token-health
  cancel-in-progress: true

jobs:
  assessment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Syntax-check token health monitor
        run: node --check scripts/check-meta-token-health.mjs
      - name: Test token assessment logic without credentials
        run: node scripts/test-meta-token-health.mjs

  token-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Assess tokens locally with Meta debug_token
        env:
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-meta-token-health.mjs
