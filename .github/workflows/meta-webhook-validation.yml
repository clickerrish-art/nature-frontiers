name: Meta webhook branch validation

on:
  push:
    branches:
      - codex/instagram-unified-login-setup
    paths:
      - "scripts/meta-webhook.mjs"
      - "scripts/test-meta-webhook.mjs"
      - ".github/workflows/meta-webhook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check webhook handler syntax
        run: node --check scripts/meta-webhook.mjs
      - name: Test challenge verification, HMAC signatures and durable persistence failure handling
        run: node scripts/test-meta-webhook.mjs
